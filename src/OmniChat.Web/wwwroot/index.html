<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmniChat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090c12;
      --panel: #111826;
      --card: #161f30;
      --line: #28364f;
      --text: #e6edf3;
      --muted: #8da2c0;
      --brand: #66b3ff;
      --assistant: #1f8f6435;
      --user: #3262d235;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #1c2b46 0%, transparent 35%),
        radial-gradient(circle at 90% 90%, #1a4634 0%, transparent 30%),
        var(--bg);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
      gap: 18px;
      padding: 18px;
    }

    .panel {
      background: linear-gradient(180deg, #111a2a 0%, #0f1724 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .sidebar {
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .logo {
      font-weight: 800;
      letter-spacing: 0.2px;
      font-size: 1.06rem;
    }

    .pill {
      border: 1px solid #2b4768;
      color: #bcd8ff;
      background: #132239;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    .heading {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #dbe8ff;
    }

    .subtle {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .sessions-list {
      overflow: auto;
      display: grid;
      gap: 8px;
      align-content: start;
      padding-right: 4px;
    }

    .session {
      cursor: pointer;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .session:hover {
      border-color: #3a5a85;
      transform: translateY(-1px);
    }

    .session.active { border-color: var(--brand); }

    .session-title {
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .chat {
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      min-height: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 4px;
    }

    .chat-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .messages {
      background: #0f1726;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      overflow: auto;
      display: grid;
      gap: 10px;
      align-content: start;
      min-height: 0;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed #324766;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 0.9rem;
    }

    .msg {
      border: 1px solid #30425f;
      border-radius: 12px;
      padding: 10px 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.user { background: var(--user); }
    .msg.assistant { background: var(--assistant); }

    .msg-role {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #d6e9ff;
      margin-bottom: 6px;
    }

    .msg-content {
      margin: 0;
      line-height: 1.42;
      color: #f3f6fb;
    }

    input, textarea, button {
      width: 100%;
      border-radius: 11px;
      border: 1px solid #355078;
      background: #0c1422;
      color: var(--text);
      padding: 10px;
      font: inherit;
    }

    input:focus, textarea:focus {
      outline: 2px solid #3e7fc7;
      outline-offset: 1px;
      border-color: #5b95d5;
    }

    textarea { resize: vertical; min-height: 88px; }

    button {
      cursor: pointer;
      border: none;
      background: linear-gradient(180deg, #2a78d5 0%, #1f63b4 100%);
      color: #fff;
      font-weight: 700;
      transition: transform 120ms ease, filter 120ms ease;
      min-width: 122px;
    }

    button:hover:enabled {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .composer-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 8px;
      align-items: end;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80a6;
      display: inline-block;
      margin-right: 6px;
    }

    .error {
      color: #ffd2d2;
      background: #5f1d2a;
      border: 1px solid #8d3b4b;
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 0.84rem;
      display: none;
    }

    .hint {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 6px;
    }

    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel sidebar">
      <div class="brand">
        <div class="logo">OmniChat</div>
        <span class="pill">Local-first BYOK</span>
      </div>

      <div class="card">
        <h2 class="heading">New session</h2>
        <p class="subtle">Create dedicated conversations per task while keeping local control of chat data.</p>
        <input id="newSessionTitle" aria-label="New session title" placeholder="Session title" value="New Session" />
        <button id="createSessionBtn" style="margin-top: 8px;">Create Session</button>
      </div>

      <div id="sessions" class="sessions-list" aria-label="Sessions list"></div>
    </aside>

    <main class="panel chat">
      <div class="chat-header">
        <h1 class="chat-title">Unified Assistant Workspace</h1>
        <div class="meta"><span class="status-dot"></span><span id="statusText">Ready</span></div>
      </div>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section class="card">
        <div class="status-bar">
          <span>Prompt Composer</span>
          <span id="activeSessionLabel">No session selected</span>
        </div>
        <textarea id="prompt" placeholder="Type your prompt... (Ctrl/Cmd + Enter to send)"></textarea>
        <div class="composer-grid">
          <input id="model" aria-label="Model" placeholder="Model (e.g. gpt-4o-mini)" value="demo-local-model" />
          <button id="sendBtn">Send</button>
        </div>
        <div id="errorBox" class="error" role="alert"></div>
        <div class="hint">No telemetry by default. Session data stays local in this baseline demo process.</div>
      </section>
    </main>
  </div>

  <script>
    let selectedSessionId = null;
    let loading = false;

    const sessionsEl = document.getElementById('sessions');
    const messagesEl = document.getElementById('messages');
    const statusTextEl = document.getElementById('statusText');
    const activeSessionLabelEl = document.getElementById('activeSessionLabel');
    const errorBoxEl = document.getElementById('errorBox');
    const sendButtonEl = document.getElementById('sendBtn');
    const createSessionButtonEl = document.getElementById('createSessionBtn');

    function setStatus(text, busy = false) {
      statusTextEl.textContent = text;
      loading = busy;
      sendButtonEl.disabled = busy;
      createSessionButtonEl.disabled = busy;
    }

    function setError(message) {
      if (!message) {
        errorBoxEl.style.display = 'none';
        errorBoxEl.textContent = '';
        return;
      }

      errorBoxEl.textContent = message;
      errorBoxEl.style.display = 'block';
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `Request failed (${response.status})`);
      }

      return response.json();
    }

    function createTextElement(tag, className, value) {
      const element = document.createElement(tag);
      if (className) {
        element.className = className;
      }
      element.textContent = value;
      return element;
    }

    function renderEmptyMessage() {
      messagesEl.innerHTML = '';
      messagesEl.appendChild(createTextElement('div', 'empty', 'Start a new session and send a message to begin.'));
    }

    async function loadSessions() {
      const sessions = await fetchJson('/api/sessions');
      sessionsEl.innerHTML = '';

      if (sessions.length === 0) {
        const empty = createTextElement('div', 'card subtle', 'No sessions yet. Create one to get started.');
        sessionsEl.appendChild(empty);
        selectedSessionId = null;
        activeSessionLabelEl.textContent = 'No session selected';
        renderEmptyMessage();
        return;
      }

      sessions.forEach(session => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `card session${session.id === selectedSessionId ? ' active' : ''}`;

        const title = createTextElement('p', 'session-title', session.title || 'Untitled Session');
        const meta = createTextElement('div', 'meta', `${session.messageCount} messages`);
        card.append(title, meta);

        card.onclick = async () => {
          if (loading) {
            return;
          }

          selectedSessionId = session.id;
          await refreshAll();
        };

        sessionsEl.appendChild(card);
      });

      if (!selectedSessionId) {
        selectedSessionId = sessions[0].id;
      }

      const active = sessions.find(s => s.id === selectedSessionId) ?? sessions[0];
      activeSessionLabelEl.textContent = `Active: ${active.title}`;
    }

    async function loadSession(id) {
      if (!id) {
        renderEmptyMessage();
        return;
      }

      const session = await fetchJson(`/api/sessions/${id}`);
      messagesEl.innerHTML = '';

      if (!session.messages || session.messages.length === 0) {
        messagesEl.appendChild(createTextElement('div', 'empty', 'This session has no messages yet.'));
        return;
      }

      session.messages.forEach(msg => {
        const card = document.createElement('article');
        card.className = `msg ${msg.role === 'assistant' ? 'assistant' : 'user'}`;

        const role = createTextElement('div', 'msg-role', msg.role === 'assistant' ? 'Assistant' : 'You');
        const content = createTextElement('p', 'msg-content', msg.content || '');
        const ts = createTextElement('div', 'meta', new Date(msg.timestamp).toLocaleString());

        card.append(role, content, ts);
        messagesEl.appendChild(card);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function refreshAll() {
      setStatus('Syncing...', true);
      setError('');

      try {
        await loadSessions();
        await loadSession(selectedSessionId);
        setStatus('Ready', false);
      } catch (error) {
        setStatus('Error', false);
        setError(error.message || 'Unexpected error');
      }
    }

    async function createSession() {
      if (loading) {
        return;
      }

      const title = document.getElementById('newSessionTitle').value.trim() || 'New Session';
      setStatus('Creating session...', true);
      setError('');

      try {
        const response = await fetchJson('/api/sessions', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title })
        });

        selectedSessionId = response.id;
        await refreshAll();
      } catch (error) {
        setStatus('Ready', false);
        setError(error.message || 'Failed to create session');
      }
    }

    async function sendMessage() {
      if (loading || !selectedSessionId) {
        return;
      }

      const promptEl = document.getElementById('prompt');
      const modelEl = document.getElementById('model');
      const content = promptEl.value.trim();

      if (!content) {
        setError('Please enter a prompt before sending.');
        return;
      }

      const model = modelEl.value.trim() || 'demo-local-model';
      setStatus('Generating response...', true);
      setError('');

      try {
        await fetchJson(`/api/sessions/${selectedSessionId}/messages`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ content, providerId: 'local-byok', model })
        });

        promptEl.value = '';
        await refreshAll();
      } catch (error) {
        setStatus('Ready', false);
        setError(error.message || 'Failed to send message');
      }
    }

    createSessionButtonEl.onclick = createSession;
    sendButtonEl.onclick = sendMessage;

    document.getElementById('prompt').addEventListener('keydown', (event) => {
      const isModifier = event.ctrlKey || event.metaKey;
      if (isModifier && event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    });

    refreshAll();
  </script>
</body>
</html>
